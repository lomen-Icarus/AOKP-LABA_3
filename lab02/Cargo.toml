[package]
name = "bevy-lab02-color-cycle"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
# Только необходимые подсистемы: 3D, приложение и окно, без звука и геймпадов.
bevy = { version = "0.19", default-features = false, features = [
    "3d_bevy_render", "default_app", "std", "bevy_winit", "multi_threaded", "x11",
] }

[dev-dependencies]
# Кодирование PNG нужно только примеру capture, основная сборка остаётся минимальной.
bevy = { version = "0.19", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 3
